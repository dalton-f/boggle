<!doctype html>
<html lang="en" class="bg-slate-700 antialiased select-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boggle</title>

    <link rel="stylesheet" href="static/css/app.css" />

    <script src="static/js/app.js" defer></script>
  </head>
  <body class="xs:p-5 grid place-items-center min-block-svh">
    <main class="grid gap-4 lg:grid-cols-[max-content_320px]">
      <div class="flex flex-col gap-4">
        <!-- Game Title + Description -->
        <div
          class="xs:p-4 flex w-full max-w-[36rem] max-w-xl flex-col rounded-lg bg-slate-200 p-2 md:rounded-3xl md:p-8"
        >
          <h1 class="pb-2 text-xl font-bold md:text-3xl">Boggle</h1>

          <p class="pt-2">
            Drag or click to find as many words as you can before time runs out.
            Longer words earn more points!
          </p>
        </div>

        <!-- Game Board -->
        <div
          class="xs:p-4 flex h-full flex-col gap-10 rounded-lg bg-slate-200 p-2 md:rounded-3xl md:p-8 lg:gap-0"
          id="gameBoardParent"
        >
          <div
            class="flex items-center justify-between text-lg font-bold md:text-3xl"
          >
            <p id="timerElement">03:00</p>
            <p>
              <span
                class="inline-block transition-transform duration-150"
                id="pointsCounterElement"
                >0</span
              >
              points
            </p>
          </div>

          <div
            class="m-auto grid grid-cols-[repeat(4,_70px)] gap-2 md:grid-cols-[repeat(4,_74px)]"
            id="gameTray"
          >
            <button
              class="xs:text-2xl grid aspect-square cursor-pointer place-items-center rounded-lg bg-gray-300 p-1.25 text-xl font-bold sm:text-3xl md:text-4xl"
            >
              <span
                class="grid aspect-square w-15 place-items-center rounded-full bg-white"
              >
                A
              </span>
            </button>

            <button
              class="xs:text-2xl grid aspect-square cursor-pointer place-items-center rounded-lg bg-gray-300 p-1.25 text-xl font-bold sm:text-3xl md:text-4xl"
            >
              <span
                class="grid aspect-square w-15 place-items-center rounded-full bg-white"
              >
                A
              </span>
            </button>

            <button
              class="xs:text-2xl grid aspect-square cursor-pointer place-items-center rounded-lg bg-gray-300 p-1.25 text-xl font-bold sm:text-3xl md:text-4xl"
            >
              <span
                class="grid aspect-square w-15 place-items-center rounded-full bg-white"
              >
                A
              </span>
            </button>

            <button
              class="xs:text-2xl grid aspect-square cursor-pointer place-items-center rounded-lg bg-gray-300 p-1.25 text-xl font-bold sm:text-3xl md:text-4xl"
            >
              <span
                class="grid aspect-square w-15 place-items-center rounded-full bg-white"
              >
                A
              </span>
            </button>

            <button
              class="xs:text-2xl grid aspect-square cursor-pointer place-items-center rounded-lg bg-gray-300 p-1.25 text-xl font-bold sm:text-3xl md:text-4xl"
            >
              <span
                class="grid aspect-square w-15 place-items-center rounded-full bg-white"
              >
                A
              </span>
            </button>

            <button
              class="xs:text-2xl grid aspect-square cursor-pointer place-items-center rounded-lg bg-gray-300 p-1.25 text-xl font-bold sm:text-3xl md:text-4xl"
            >
              <span
                class="grid aspect-square w-15 place-items-center rounded-full bg-white"
              >
                A
              </span>
            </button>

            <button
              class="xs:text-2xl grid aspect-square cursor-pointer place-items-center rounded-lg bg-gray-300 p-1.25 text-xl font-bold sm:text-3xl md:text-4xl"
            >
              <span
                class="grid aspect-square w-15 place-items-center rounded-full bg-white"
              >
                A
              </span>
            </button>

            <button
              class="xs:text-2xl grid aspect-square cursor-pointer place-items-center rounded-lg bg-gray-300 p-1.25 text-xl font-bold sm:text-3xl md:text-4xl"
            >
              <span
                class="grid aspect-square w-15 place-items-center rounded-full bg-white"
              >
                A
              </span>
            </button>

            <button
              class="xs:text-2xl grid aspect-square cursor-pointer place-items-center rounded-lg bg-gray-300 p-1.25 text-xl font-bold sm:text-3xl md:text-4xl"
            >
              <span
                class="grid aspect-square w-15 place-items-center rounded-full bg-white"
              >
                A
              </span>
            </button>

            <button
              class="xs:text-2xl grid aspect-square cursor-pointer place-items-center rounded-lg bg-gray-300 p-1.25 text-xl font-bold sm:text-3xl md:text-4xl"
            >
              <span
                class="grid aspect-square w-15 place-items-center rounded-full bg-white"
              >
                A
              </span>
            </button>

            <button
              class="xs:text-2xl grid aspect-square cursor-pointer place-items-center rounded-lg bg-gray-300 p-1.25 text-xl font-bold sm:text-3xl md:text-4xl"
            >
              <span
                class="grid aspect-square w-15 place-items-center rounded-full bg-white"
              >
                A
              </span>
            </button>

            <button
              class="xs:text-2xl grid aspect-square cursor-pointer place-items-center rounded-lg bg-gray-300 p-1.25 text-xl font-bold sm:text-3xl md:text-4xl"
            >
              <span
                class="grid aspect-square w-15 place-items-center rounded-full bg-white"
              >
                A
              </span>
            </button>

            <button
              class="xs:text-2xl grid aspect-square cursor-pointer place-items-center rounded-lg bg-gray-300 p-1.25 text-xl font-bold sm:text-3xl md:text-4xl"
            >
              <span
                class="grid aspect-square w-15 place-items-center rounded-full bg-white"
              >
                A
              </span>
            </button>

            <button
              class="xs:text-2xl grid aspect-square cursor-pointer place-items-center rounded-lg bg-gray-300 p-1.25 text-xl font-bold sm:text-3xl md:text-4xl"
            >
              <span
                class="grid aspect-square w-15 place-items-center rounded-full bg-white"
              >
                A
              </span>
            </button>

            <button
              class="xs:text-2xl grid aspect-square cursor-pointer place-items-center rounded-lg bg-gray-300 p-1.25 text-xl font-bold sm:text-3xl md:text-4xl"
            >
              <span
                class="grid aspect-square w-15 place-items-center rounded-full bg-white"
              >
                A
              </span>
            </button>

            <button
              class="xs:text-2xl grid aspect-square cursor-pointer place-items-center rounded-lg bg-gray-300 p-1.25 text-xl font-bold sm:text-3xl md:text-4xl"
            >
              <span
                class="grid aspect-square w-15 place-items-center rounded-full bg-white"
              >
                A
              </span>
            </button>
          </div>
        </div>
      </div>

      <div class="grid gap-4">
        <!-- Correct Guesses -->
        <div
          class="xs:p-4 min-w-0 divide-y divide-black/20 rounded-lg bg-slate-200 p-2 font-bold md:rounded-3xl md:p-8"
        >
          <p class="pb-2 text-lg md:text-xl">Correct Guesses</p>

          <!-- 3 letters -->
          <div class="flex flex-col gap-2 py-2">
            <p class="text-lg">3 letters:</p>

            <div
              class="flex min-h-[26px] scrollbar-none items-center gap-2 overflow-x-auto scroll-smooth"
              id="threeLetterCorrectGuessesRow"
            ></div>
          </div>

          <!-- 4 letters -->
          <div class="flex flex-col gap-2 py-2">
            <p class="text-lg">4 letters:</p>

            <div
              class="flex min-h-[26px] scrollbar-none items-center gap-2 overflow-x-auto scroll-smooth"
              id="fourLetterCorrectGuessesRow"
            ></div>
          </div>

          <!-- 5 letters -->
          <div class="flex flex-col gap-2 py-2">
            <p class="text-lg">5 letters:</p>

            <div
              class="flex min-h-[26px] scrollbar-none items-center gap-2 overflow-x-auto scroll-smooth"
              id="fiveLetterCorrectGuessesRow"
            ></div>
          </div>

          <!-- 6 letters -->
          <div class="flex flex-col gap-2 py-2">
            <p class="text-lg">6 letters:</p>

            <div
              class="flex min-h-[26px] scrollbar-none items-center gap-2 overflow-x-auto scroll-smooth"
              id="sixLetterCorrectGuessesRow"
            ></div>
          </div>

          <!-- 7+ letters -->
          <div class="flex flex-col gap-2 pt-2">
            <p class="text-lg">7+ letters:</p>

            <div
              class="flex min-h-[26px] scrollbar-none items-center gap-2 overflow-x-auto scroll-smooth"
              id="sevenLetterCorrectGuessesRow"
            ></div>
          </div>
        </div>

        <!-- Settings -->
        <form
          class="xs:p-4 rounded-lg bg-slate-200 p-2 md:rounded-3xl md:p-8"
          id="settingsForm"
        >
          <fieldset>
            <legend class="text-lg font-bold md:text-xl">Settings</legend>

            <div class="my-4 flex flex-col gap-2 md:flex-row lg:flex-col">
              <div
                class="flex w-full items-center justify-between rounded-full border border-black/20 px-2 py-2 text-lg font-bold md:text-xl"
              >
                <button
                  class="flex aspect-square h-full w-8 cursor-pointer items-center justify-center rounded-full border border-black/20 bg-white font-mono text-3xl"
                  type="button"
                  aria-label="Decrease grid size"
                  id="gridSizeDecreaseButton"
                >
                  -
                </button>

                <label for="gridSizeSelector" class="sr-only"
                  >Grid size (4-6):</label
                >

                <select
                  name="gridSizeSelector"
                  id="gridSizeSelector"
                  class="appearance-none"
                >
                  <option value="4x4" selected>4 x 4</option>
                  <option value="5x5">5 x 5</option>
                  <option value="6x6">6 x 6</option>
                </select>

                <button
                  class="flex aspect-square h-full w-8 cursor-pointer items-center justify-center rounded-full border border-black/20 bg-white font-mono text-3xl"
                  type="button"
                  aria-label="Increase grid size"
                  id="gridSizeIncreaseButton"
                >
                  +
                </button>
              </div>

              <div
                class="flex w-full items-center justify-between rounded-full border border-black/20 px-2 py-2 text-lg font-bold md:text-xl"
              >
                <button
                  class="flex aspect-square h-full w-8 cursor-pointer items-center justify-center rounded-full border border-black/20 bg-white font-mono text-3xl"
                  type="button"
                  id="timeLimitDecreaseButton"
                  aria-label="Decrease time limit"
                >
                  -
                </button>

                <label for="timeLimitSelector" class="sr-only"
                  >Time limit of the game (3 minutes - 5 minutes):</label
                >

                <select
                  name="timeLimitSelector"
                  id="timeLimitSelector"
                  class="appearance-none"
                >
                  <option value="3" selected>03:00</option>
                  <option value="4">04:00</option>
                  <option value="5">05:00</option>
                </select>

                <button
                  class="flex aspect-square h-full w-8 cursor-pointer items-center justify-center rounded-full border border-black/20 bg-white font-mono text-3xl"
                  type="button"
                  id="timeLimitIncreaseButton"
                  aria-label="Increase time limit"
                >
                  +
                </button>
              </div>
            </div>

            <button
              class="flex w-full cursor-pointer items-center justify-center rounded-lg bg-slate-900 p-4 font-bold text-white uppercase md:rounded-3xl"
              type="submit"
            >
              + New Game
            </button>
          </fieldset>
        </form>
      </div>
    </main>
  </body>
</html>
