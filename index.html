<!doctype html>
<html lang="en" class="bg-slate-700 antialiased select-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boggle</title>

    <link rel="stylesheet" href="static/css/app.css" />

    <script src="static/js/app.js" defer></script>
  </head>
  <body class="grid place-items-center min-block-svh">
    <main class="grid grid-cols-[max-content_320px] gap-4">
      <div class="flex flex-col gap-4">
        <!-- Game Title + Description -->
        <div
          class="flex w-full max-w-[36rem] max-w-xl flex-col rounded-3xl bg-slate-200 p-8"
        >
          <h1 class="pb-2 text-3xl font-bold">Boggle</h1>

          <p class="py-2">
            Drag or click to find as many words as you can before time runs out.
            Longer words earn more points!
          </p>
        </div>

        <!-- Game Board -->
        <div class="flex h-full flex-col gap-4 rounded-3xl bg-slate-200 p-8">
          <div class="flex items-center justify-between text-3xl font-bold">
            <p>03:00 / 03:00</p>
            <p>0 points</p>
          </div>

          <div class="m-auto grid grid-cols-[repeat(4,_74px)] gap-2">
            <button
              class="cursor-pointer rounded-lg bg-gray-300 p-1.25 text-4xl font-bold"
            >
              <span
                class="grid aspect-square w-16 place-items-center rounded-full bg-white"
                >M</span
              >
            </button>
            <button
              class="cursor-pointer rounded-lg bg-gray-300 p-1.25 text-4xl font-bold"
            >
              <span
                class="grid aspect-square w-16 place-items-center rounded-full bg-white"
                >M</span
              >
            </button>
            <button
              class="cursor-pointer rounded-lg bg-gray-300 p-1.25 text-4xl font-bold"
            >
              <span
                class="grid aspect-square w-16 place-items-center rounded-full bg-white"
                >M</span
              >
            </button>
            <button
              class="cursor-pointer rounded-lg bg-gray-300 p-1.25 text-4xl font-bold"
            >
              <span
                class="grid aspect-square w-16 place-items-center rounded-full bg-white"
                >M</span
              >
            </button>
            <button
              class="cursor-pointer rounded-lg bg-gray-300 p-1.25 text-4xl font-bold"
            >
              <span
                class="grid aspect-square w-16 place-items-center rounded-full bg-white"
                >M</span
              >
            </button>
            <button
              class="cursor-pointer rounded-lg bg-gray-300 p-1.25 text-4xl font-bold"
            >
              <span
                class="grid aspect-square w-16 place-items-center rounded-full bg-white"
                >M</span
              >
            </button>

            <button
              class="cursor-pointer rounded-lg bg-gray-300 p-1.25 text-4xl font-bold"
            >
              <span
                class="grid aspect-square w-16 place-items-center rounded-full bg-white"
                >M</span
              >
            </button>
            <button
              class="cursor-pointer rounded-lg bg-gray-300 p-1.25 text-4xl font-bold"
            >
              <span
                class="grid aspect-square w-16 place-items-center rounded-full bg-white"
                >M</span
              >
            </button>
            <button
              class="cursor-pointer rounded-lg bg-gray-300 p-1.25 text-4xl font-bold"
            >
              <span
                class="grid aspect-square w-16 place-items-center rounded-full bg-white"
                >M</span
              >
            </button>
            <button
              class="cursor-pointer rounded-lg bg-gray-300 p-1.25 text-4xl font-bold"
            >
              <span
                class="grid aspect-square w-16 place-items-center rounded-full bg-white"
                >M</span
              >
            </button>
            <button
              class="cursor-pointer rounded-lg bg-gray-300 p-1.25 text-4xl font-bold"
            >
              <span
                class="grid aspect-square w-16 place-items-center rounded-full bg-white"
                >M</span
              >
            </button>
            <button
              class="cursor-pointer rounded-lg bg-gray-300 p-1.25 text-4xl font-bold"
            >
              <span
                class="grid aspect-square w-16 place-items-center rounded-full bg-white"
                >M</span
              >
            </button>
            <button
              class="cursor-pointer rounded-lg bg-gray-300 p-1.25 text-4xl font-bold"
            >
              <span
                class="grid aspect-square w-16 place-items-center rounded-full bg-white"
                >M</span
              >
            </button>
            <button
              class="cursor-pointer rounded-lg bg-gray-300 p-1.25 text-4xl font-bold"
            >
              <span
                class="grid aspect-square w-16 place-items-center rounded-full bg-white"
                >M</span
              >
            </button>
            <button
              class="cursor-pointer rounded-lg bg-gray-300 p-1.25 text-4xl font-bold"
            >
              <span
                class="grid aspect-square w-16 place-items-center rounded-full bg-white"
                >M</span
              >
            </button>
            <button
              class="cursor-pointer rounded-lg bg-gray-300 p-1.25 text-4xl font-bold"
            >
              <span
                class="grid aspect-square w-16 place-items-center rounded-full bg-white"
                >M</span
              >
            </button>
          </div>
        </div>
      </div>

      <div class="grid gap-4">
        <!-- Correct Guesses -->
        <div
          class="divide-y divide-black/20 rounded-3xl bg-slate-200 p-8 font-bold"
        >
          <p class="pb-2 text-xl">Correct Guesses</p>

          <!-- 3 letters -->
          <div class="flex flex-col gap-2 py-2">
            <p class="text-lg">3 letters:</p>

            <div
              class="no-scrollbar flex min-h-[26px] items-center gap-2 overflow-x-scroll"
            ></div>
          </div>

          <!-- 4 letters -->
          <div class="flex flex-col gap-2 py-2">
            <p class="text-lg">4 letters:</p>

            <div
              class="no-scrollbar flex min-h-[26px] items-center gap-2 overflow-x-scroll"
            ></div>
          </div>

          <!-- 5 letters -->
          <div class="flex flex-col gap-2 py-2">
            <p class="text-lg">5 letters:</p>

            <div
              class="no-scrollbar flex min-h-[26px] items-center gap-2 overflow-x-scroll"
            ></div>
          </div>

          <!-- 6 letters -->
          <div class="flex flex-col gap-2 py-2">
            <p class="text-lg">6 letters:</p>

            <div
              class="no-scrollbar flex min-h-[26px] items-center gap-2 overflow-x-scroll"
            ></div>
          </div>

          <!-- 7+ letters -->
          <div class="flex flex-col gap-2 pt-2">
            <p class="text-lg">7+ letters:</p>

            <div
              class="no-scrollbar flex min-h-[26px] items-center gap-2 overflow-x-scroll"
            ></div>
          </div>
        </div>

        <!-- Settings -->
        <form class="flex flex-col gap-2 rounded-3xl bg-slate-200 p-8">
          <fieldset>
            <legend class="pb-2 text-xl font-bold">Settings</legend>

            <div class="flex flex-col gap-2">
              <div
                class="flex items-center justify-between rounded-full border border-black/20 px-2 py-2 text-xl font-bold"
              >
                <button
                  class="flex aspect-square w-10 cursor-pointer items-center justify-center rounded-full border border-black/20 bg-white font-mono text-3xl"
                  aria-label="Decrease grid size"
                >
                  -
                </button>

                <label for="gridSize" class="sr-only">Grid size (4-6):</label>

                <input
                  type="number"
                  name="gridSize"
                  id="gridSize"
                  min="4"
                  max="6"
                  value="4"
                  class="text-center"
                  required
                />

                <button
                  class="flex aspect-square w-10 cursor-pointer items-center justify-center rounded-full border border-black/20 bg-white font-mono text-3xl"
                  aria-label="Increase grid size"
                >
                  +
                </button>
              </div>

              <div
                class="mb-2 flex items-center justify-between rounded-full border border-black/20 px-2 py-2 text-xl font-bold"
              >
                <button
                  class="flex aspect-square w-10 cursor-pointer items-center justify-center rounded-full border border-black/20 bg-white font-mono text-3xl"
                  aria-label="Decrease time limit"
                >
                  -
                </button>

                <label for="timeLimit" class="sr-only"
                  >Time limit of the game (3 minutes - 5 minutes):</label
                >

                <select name="timeLimit" id="timeLimit" class="appearance-none">
                  <option value="3" selected>03:00</option>
                  <option value="4">04:00</option>
                  <option value="5">05:00</option>
                </select>

                <button
                  class="flex aspect-square w-10 cursor-pointer items-center justify-center rounded-full border border-black/20 bg-white font-mono text-3xl"
                  aria-label="Increase time limit"
                >
                  +
                </button>
              </div>
            </div>

            <button
              class="flex w-full cursor-pointer items-center justify-center rounded-3xl bg-slate-900 p-4 font-bold text-white uppercase"
              type="submit"
            >
              + New Game
            </button>
          </fieldset>
        </form>
      </div>
    </main>
  </body>
</html>
